[package]
name = "emp-be"
version = "0.1.0"
edition = "2024"

[dependencies]
dotenv = "0.15.0"
sea-orm = { version = "2.0.0-rc.13", features = ["sqlx-postgres", "runtime-async-std-native-tls"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
actix-web = "4.11.0"
redis = { version = "0.25", features = ["aio", "connection-manager", "async-std-comp"] }
rumqttc = "0.24"
serde_json = "1.0"
tokio = "1.48.0"
log = "0.4.28"
serde = { version = "1.0.228", features = ["derive"] }
uuid = { version = "1.18.1", features = ["v4"] }
chrono = "0.4.42"
rand = "0.9.2"
jsonwebtoken = { version = "10.1.0", features = ["rust_crypto"] }
argon2 = "0.5"
rand_core = { version = "0.6", features = ["std"] }
tracing-appender = "0.2"
futures = "0.3.31"
regex = "1.12.2"

utoipa = { version = "5.4.0", features = ["actix_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { version = "7.1.1-rc.0", features = ["actix-web"] }